version: '3.8'

services:
  xerocare-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined into the client JS bundle at build time,
        # not read at container-start — so this has to be a build arg, not just
        # a runtime env var, and the image needs rebuilding whenever it changes.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: xerocare-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # RabbitMQ, Redis and Postgres use their compose service hostnames —
      # override whatever localhost-pointed values came from .env.
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379
      BILLING_DATABASE_URL: postgresql://xerouser:password123@postgres:5432/xerocare_billing
      CRM_DATABASE_URL: postgresql://xerouser:password123@postgres:5432/xerocare_crm
      EMPLOYEE_DATABASE_URL: postgresql://xerouser:password123@postgres:5432/xerocare_employee
      VENDOR_DATABASE_URL: postgresql://xerouser:password123@postgres:5432/xerocare_vendor
    ports:
      # Host-side mapping for local dev lives in docker-compose.override.yml
      # (auto-merged on top of this file by `docker compose up`) — these
      # unmapped defaults are what docker-compose-deploy.yml uses as-is.
      - '3000' # Frontend (Next.js)
      - '3001' # API Gateway
      - '3002' # Employee Service
      - '3003' # Vendor/Inventory Service
      - '3004' # Billing Service
      - '3005' # CRM Service
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
      mongodb:
        condition: service_started
    # Fix for Alpine/musl EAI_AGAIN DNS failures on concurrent external lookups
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - xerocare-network

  redis:
    image: redis:7-alpine
    container_name: xerocare-redis
    restart: unless-stopped
    ports:
      - '6379'
    volumes:
      - redis_data:/data
    networks:
      - xerocare-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: xerocare-rabbitmq
    restart: unless-stopped
    ports:
      - '5672' # AMQP protocol port
      - '15672' # HTTP Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    networks:
      - xerocare-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: xerocare-postgres
    restart: unless-stopped
    environment:
      # Matches what every backend service's *_DATABASE_URL already expects
      # (each service is its own database — the init script below creates the
      # other 3; POSTGRES_DB only auto-creates this first one).
      POSTGRES_DB: xerocare_billing
      POSTGRES_USER: xerouser
      POSTGRES_PASSWORD: password123
    ports:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - xerocare-network

  mongodb:
    image: mongo:7
    container_name: xerocare-mongodb
    restart: unless-stopped
    ports:
      - '27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - xerocare-network

networks:
  xerocare-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  postgres_data:
  mongodb_data:
